<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
      @media (prefers-color-scheme: dark) {
        .k { stroke: #fafafa; stroke-width: 16; paint-order: stroke; }
      }
    </style>
  

  <!-- ears, drawn first so the face overlaps their base -->
  <circle class="k" cx="142" cy="152" r="68" fill="#0b0b0b" />
  <circle class="k" cx="370" cy="152" r="68" fill="#0b0b0b" />

  <!-- face -->
  <ellipse cx="256" cy="288" rx="174" ry="160" fill="#ffffff"/>

  <!-- eye patches, tilted inward the way a panda's actually sit -->
  <ellipse cx="180" cy="266" rx="55" ry="73" fill="#0b0b0b" transform="rotate(-20 180 266)"/>
  <ellipse cx="332" cy="266" rx="55" ry="73" fill="#0b0b0b" transform="rotate(20 332 266)"/>

  <!-- eyes -->
  <circle cx="188" cy="256" r="19" fill="#ffffff"/>
  <circle cx="324" cy="256" r="19" fill="#ffffff"/>

  <!-- nose + mouth -->
  <ellipse cx="256" cy="356" rx="32" ry="24" fill="#0b0b0b"/>
  <path d="M256 380 q0 26 -30 26 M256 380 q0 26 30 26"
        fill="none" stroke="#0b0b0b" stroke-width="13" stroke-linecap="round"/>
</svg>