<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Symond — web developer building high-performance web applications with React, Laravel and Tailwind CSS."
    />
    <title>Symond — Web Developer</title>
    <script>
      // Apply the stored theme before first paint so a light-mode visitor
      // never sees a flash of the dark palette. Mirrors next-themes' storage
      // key and defaultTheme.
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
